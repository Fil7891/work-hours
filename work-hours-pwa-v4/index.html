<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Work Hours</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">Offline work tracker</div>
    <h1>Work Hours</h1>
  </div>
  <button id="installBtn" class="ghost hidden">Install</button>
</header>

<main class="container">
  <section class="card calendar-card">
    <div class="calendar-header">
      <button id="prevMonth" class="calendar-nav" aria-label="Previous month">‹</button>
      <div>
        <h2 id="monthTitle"></h2>
        <div id="monthSummary" class="muted small"></div>
      </div>
      <button id="nextMonth" class="calendar-nav" aria-label="Next month">›</button>
    </div>

    <div class="calendar-weekdays">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span>
      <span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div id="calendarGrid" class="calendar-grid"></div>
  </section>

  <section class="card selected-day-card">
    <div class="section-head">
      <div>
        <div class="eyebrow dark">Selected day</div>
        <h2 id="selectedDateTitle">Select a date</h2>
      </div>
      <button id="addHoursBtn" class="primary" disabled>+ Add hours</button>
    </div>

    <div id="daySummary" class="day-summary hidden">
      <div><span>Total worked</span><strong id="selectedHours">0h 00m</strong></div>
      <div><span>Regular</span><strong id="selectedRegular">0h 00m</strong></div>
      <div><span>Overtime</span><strong id="selectedOvertime">0h 00m</strong></div>
      <div><span>Gross pay</span><strong id="selectedPay">$0.00</strong></div>
    </div>
    <div id="selectedEntries" class="selected-entries">
      <div class="empty">Tap a day in the calendar to add or edit your hours.</div>
    </div>
  </section>

  <dialog id="entryDialog">
    <form id="entryForm" class="dialog-form">
      <h2 id="dialogTitle">Add hours</h2>
      <input type="hidden" id="entryId">
      <label>Date<input type="date" id="entryDate" required></label>
      <div class="two-col">
        <label>Start time<input type="time" id="entryStart" required></label>
        <label>Finish time<input type="time" id="entryEnd" required></label>
      </div>
      <label>Break minutes<input type="number" id="entryBreak" min="0" step="1" value="0"></label>
      <label>Notes<textarea id="entryNotes" rows="3" placeholder="Job, project or notes"></textarea></label>

      <div id="entryPreview" class="entry-preview">
        <div><span>Hours</span><strong id="previewHours">0h 00m</strong></div>
        <div><span>Estimated gross</span><strong id="previewPay">$0.00</strong></div>
      </div>

      <div class="dialog-actions">
        <button type="button" id="deleteEntryBtn" class="danger hidden">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="cancelDialogBtn" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <nav class="bottom-nav">
    <a href="index.html" class="active">Calendar</a>
    <a href="timesheets.html">Timesheets</a>
    <a href="salary.html">Salary</a>
    <a href="settings.html">Settings</a>
  </nav>
</main>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
